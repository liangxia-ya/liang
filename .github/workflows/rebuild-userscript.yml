name: Rebuild stable userscript

on:
  push:
    paths:
      - 'source-parts/v8.4.3.3/**'
      - 'scripts/rebuild_userscript.py'
      - '.github/workflows/rebuild-userscript.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild and verify userscript
        run: python scripts/rebuild_userscript.py

      - name: Commit reconstructed userscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscript/zujuan-print-workbench.user.js
          if git diff --cached --quiet; then
            echo "Userscript is already up to date."
            exit 0
          fi
          git commit -m "build: reconstruct v8.4.3.3 userscript"
          git push
