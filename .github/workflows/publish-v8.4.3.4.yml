name: Publish v8.4.3.4

on:
  push:
    branches:
      - publish-v8.4.3.4
    paths:
      - '.github/workflows/publish-v8.4.3.4.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v8.4.3.4 from stable v8.4.3.3
        shell: python
        run: |
          from pathlib import Path

          old = Path('组卷网试卷打印工作台-8.4.3.3-大表格安全拆页版.user.js')
          new = Path('组卷网试卷打印工作台-8.4.3.4-原题着重号恢复版.user.js')
          text = old.read_text(encoding='utf-8')

          text = text.replace('// @version      8.4.3.3', '// @version      8.4.3.4', 1)
          text = text.replace(
              '// @description  基于8.4.3.2：保留答案行级连续切页，新增HTML大表格按安全<tr>边界拆页并避开rowspan，减少整表推页造成的大块空白',
              '// @description  基于8.4.3.3：恢复原题<dot>文字下方着重号；答案行级切页、大表格安全拆页及其他稳定逻辑保持不变',
              1,
          )

          preview_anchor = '                    img { max-width: 100%; }\n\n                    @media print {'
          preview_insert = '''                    img { max-width: 100%; }\n\n                    /* 8.4.3.4：恢复组卷网原题 <dot> 标签的文字下方着重号。\n                       按原站规则使用 text-emphasis，不向正文插入额外字符。 */\n                    .zujuanjs-question-body dot,\n                    .zujuanjs-answer-item dot,\n                    .zujuanjs-answer-content dot {\n                        position: relative;\n                        -webkit-text-emphasis-style: dot;\n                        text-emphasis-style: dot;\n                        -webkit-text-emphasis-position: under left;\n                        text-emphasis-position: under left;\n                        -webkit-text-emphasis-color: currentColor;\n                        text-emphasis-color: currentColor;\n                        box-sizing: border-box;\n                        padding-top: .25rem;\n                    }\n\n                    @media print {'''
          if preview_anchor not in text:
              raise SystemExit('preview CSS anchor not found')
          text = text.replace(preview_anchor, preview_insert, 1)

          export_anchor = "                            'img{max-width:100%;height:auto;}',\n                            'table{max-width:100%;border-collapse:collapse;}',"
          export_insert = "                            'img{max-width:100%;height:auto;}',\n                            'dot{position:relative;-webkit-text-emphasis-style:dot;text-emphasis-style:dot;-webkit-text-emphasis-position:under left;text-emphasis-position:under left;-webkit-text-emphasis-color:currentColor;text-emphasis-color:currentColor;box-sizing:border-box;padding-top:.25rem;}',\n                            'table{max-width:100%;border-collapse:collapse;}',"
          if export_anchor not in text:
              raise SystemExit('export CSS anchor not found')
          text = text.replace(export_anchor, export_insert, 1)

          new.write_text(text, encoding='utf-8')

      - name: Verify generated file
        shell: bash
        run: |
          set -euo pipefail
          FILE='组卷网试卷打印工作台-8.4.3.4-原题着重号恢复版.user.js'
          node --check "$FILE"
          test "$(sha256sum "$FILE" | awk '{print $1}')" = '002eca39d203206ccc4ad2f321052019e9f6cb7c74db19100eeddee071b2b671'

      - name: Commit generated stable release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '组卷网试卷打印工作台-8.4.3.4-原题着重号恢复版.user.js'
          git rm -f '.github/workflows/publish-v8.4.3.4.yml' 'source-parts/v8.4.3.4.patch'
          git commit -m 'release: publish v8.4.3.4 stable userscript'
          git push origin HEAD:publish-v8.4.3.4
